<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Task List</h1>
      <p id="count" class="count" aria-live="polite"></p>
    </header>

    <form id="add-form" class="add" autocomplete="off">
      <label for="new-title" class="sr">New task</label>
      <input id="new-title" type="text" maxlength="255" placeholder="What needs doing?" required />
      <button type="submit" class="btn primary">Add task</button>
    </form>

    <div id="error" class="error" role="alert" hidden></div>

    <nav class="filters" aria-label="Filter tasks">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="open">Open</button>
      <button class="filter" data-filter="done">Done</button>
    </nav>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
